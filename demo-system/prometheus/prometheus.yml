global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

# The job name is the service name; the MCP server's PromQL catalog relies on it.
scrape_configs:
  - job_name: storefront
    static_configs:
      - targets: ["storefront:8080"]
  - job_name: orders
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["orders:8080"]
  - job_name: payments
    static_configs:
      - targets: ["payments:8080"]
