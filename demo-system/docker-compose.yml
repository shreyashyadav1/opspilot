# OpsPilot demo system: storefront -> orders -> (postgres, payments), plus the control plane
# (deploys + chaos API), Prometheus and a load generator.
#
# The "dashboard" profile adds the agent API and the operator dashboard:
#   docker compose -f demo-system/docker-compose.yml --profile dashboard up -d --build
# The "tracing" profile adds a Jaeger all-in-one trace backend (also included with "dashboard").
# Tracing itself stays off until OPSPILOT_TRACING_ENABLED=true is set (in the repository's .env
# or the shell): every service still starts and passes its tests without it.
#
# Host ports: 8101 storefront, 8102 orders, 8103 payments, 8190 control-plane,
#             9095 prometheus, 5440 postgres; dashboard profile: 8100 dashboard, 8180 agent API;
#             tracing profile: 8166 Jaeger UI.
name: opspilot

x-tracing-env: &tracing-env
  OPSPILOT_TRACING_ENABLED: ${OPSPILOT_TRACING_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

x-python-service: &python-service
  image: opspilot-python-services:dev
  build:
    context: ./services
  restart: unless-stopped
  mem_limit: 160m
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 10s

services:
  postgres:
    image: postgres:16-alpine
    container_name: opspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-orders-local-dev}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40"]
    ports:
      - "5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  orders:
    image: opspilot-orders:dev
    build:
      context: ./orders
    container_name: opspilot-orders
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *tracing-env
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: orders
      DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders-local-dev}
      PAYMENTS_URL: http://payments:8080
    ports:
      - "8102:8080"
    mem_limit: 448m

  payments:
    <<: *python-service
    container_name: opspilot-payments
    command: ["uvicorn", "opsdemo.payments.app:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log", "--timeout-graceful-shutdown", "5"]
    environment:
      <<: *tracing-env
    ports:
      - "8103:8080"

  storefront:
    <<: *python-service
    container_name: opspilot-storefront
    command: ["uvicorn", "opsdemo.storefront.app:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log", "--timeout-graceful-shutdown", "5"]
    environment:
      <<: *tracing-env
      ORDERS_URL: http://orders:8080
    ports:
      - "8101:8080"

  control-plane:
    <<: *python-service
    container_name: opspilot-control-plane
    command: ["uvicorn", "opsdemo.control_plane.app:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log", "--timeout-graceful-shutdown", "5"]
    environment:
      <<: *tracing-env
      CP_SERVICE_URLS: storefront=http://storefront:8080,orders=http://orders:8080,payments=http://payments:8080
    ports:
      - "8190:8080"

  loadgen:
    <<: *python-service
    container_name: opspilot-loadgen
    command: ["python", "-m", "opsdemo.loadgen.main"]
    environment:
      TARGET_URL: http://storefront:8080
      RPS: "4"
    healthcheck:
      disable: true
    depends_on:
      - storefront

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: opspilot-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9095:9090"
    mem_limit: 256m

  # -- tracing profile (also included with "dashboard") ----------------------------------------
  # Jaeger all-in-one: in-memory storage, no separate collector/database. Receives OTLP/HTTP on
  # :4318 and serves its UI and query API on :16686. Every other service points at it with
  # OTEL_EXPORTER_OTLP_ENDPOINT but only actually sends spans once OPSPILOT_TRACING_ENABLED=true.

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: opspilot-jaeger
    restart: unless-stopped
    profiles: [dashboard, tracing]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "8166:16686"
      - "4318:4318"
    mem_limit: 200m

  # -- dashboard profile ----------------------------------------------------------------------

  agent-api:
    profiles: [dashboard]
    image: opspilot-agent-api:dev
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: opspilot-agent-api
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
      prometheus:
        condition: service_started
    # Model keys (GROQ_API_KEY, OPSPILOT_MODEL, ...) come from the repository's .env, if any.
    env_file:
      - path: ../.env
        required: false
    # Container-specific settings; these take precedence over the same names in .env.
    environment:
      <<: *tracing-env
      OPSPILOT_API_HOST: 0.0.0.0
      OPSPILOT_API_PORT: "8080"
      OPSPILOT_API_DATA_DIR: /data
      OPSPILOT_RESULTS_DIR: /app/evals/results
      OPSPILOT_PRICING_FILE: /app/evals/pricing.yaml
      OPSPILOT_BACKEND: live
      OPSPILOT_CHAOS_URL: http://control-plane:8080
      OPSPILOT_PROMETHEUS_URL: http://prometheus:9090
      OPSPILOT_CONTROL_PLANE_URL: http://control-plane:8080
      OPSPILOT_SERVICE_URLS: storefront=http://storefront:8080,orders=http://orders:8080,payments=http://payments:8080
    volumes:
      - agent-api-data:/data
      - ../evals/results:/app/evals/results:ro
      # The MCP server reads container logs with `docker logs`. The socket gives this container
      # control of the Docker daemon, so keep the stack local. On Linux, set DOCKER_SOCKET_GID to
      # the socket's group (stat -c %g /var/run/docker.sock); Docker Desktop uses 0.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    ports:
      - "8180:8080"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  dashboard:
    profiles: [dashboard]
    image: opspilot-dashboard:dev
    build:
      context: ../ui
    container_name: opspilot-dashboard
    restart: unless-stopped
    depends_on:
      agent-api:
        condition: service_healthy
    environment:
      OPSPILOT_API_URL: http://agent-api:8080
    ports:
      - "8100:8080"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
  agent-api-data:
