name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, tests, deterministic benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests (integration tests skip without the demo stack; API tests run below)
        run: pytest --ignore=tests/api

      - name: Benchmark with the playbook model in the simulated environment
        run: >
          opspilot-eval --env simulated --model fake:playbook
          --fail-under 1.0 --out-dir eval-results

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eval-fake-results
          path: eval-results/
          if-no-files-found: ignore

  demo-system:
    name: Demo system images (includes the orders Maven build and JUnit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Validate compose file
        run: docker compose -f demo-system/docker-compose.yml config --quiet

      - name: Build images
        run: docker compose -f demo-system/docker-compose.yml build

  api:
    name: Agent API tests and image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: API tests (approval flow, rejection, restarts, one run against the real MCP server)
        run: pytest tests/api -v

      - name: Build the agent API image
        run: docker compose -f demo-system/docker-compose.yml --profile dashboard build agent-api

  ui:
    name: Dashboard lint, tests, build and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Format check and lint
        run: |
          npm run format:check
          npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest and Testing Library)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Smoke tests against a mocked API (Playwright with the runner's Google Chrome)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: ui/playwright-report/
          if-no-files-found: ignore

      - name: Build the dashboard image
        working-directory: .
        run: docker compose -f demo-system/docker-compose.yml --profile dashboard build dashboard
