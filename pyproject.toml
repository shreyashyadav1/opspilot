[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "opspilot"
version = "0.1.0"
description = "AI on-call agent that investigates incidents through MCP tools, with a fault-injection benchmark."
readme = "README.md"
license = "MIT"
authors = [{ name = "Shreyash Yadav" }]
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "langchain-core==1.6.4",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openai==1.6.5",
    "langgraph==1.2.12",
    "mcp==1.30.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "rich==15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.8",
]

[project.scripts]
opspilot = "opspilot_agent.cli:main"
opspilot-mcp = "opspilot_mcp.__main__:main"
opspilot-eval = "opspilot_evals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent/opspilot_agent", "mcp-servers/opspilot_mcp", "evals/opspilot_evals"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["demo-system/orders"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "ASYNC", "C4", "PIE", "RET"]
ignore = [
    "RUF012",  # mutable class attributes are fine for pydantic/langchain models
]

[tool.ruff.lint.isort]
known-first-party = ["opsdemo", "opspilot_agent", "opspilot_evals", "opspilot_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["demo-system/services"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the docker compose demo stack; skipped when it is not running",
]
