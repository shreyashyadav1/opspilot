id: orders-db-pool-exhaustion
title: Leaked connections exhaust the orders database pool
description: >
  A background export job in orders leaks JDBC connections until the pool (size 5) is empty.
  Requests wait 1.5 s for a connection and fail. The orders health check reports the database
  as DOWN, which tempts a "Postgres is down" diagnosis; Postgres itself is fine.
alert:
  title: Checkout error rate above SLO
  service: storefront
  details: POST /checkout 5xx rate is above the 2% SLO; latency is elevated too.
fault:
  type: db_pool_exhaustion
  target: orders
expected:
  root_cause_service: orders
  category: resource_exhaustion
  action: {type: restart_service, target_service: orders}
relevant_services: [orders, storefront]
required_evidence:
  - {tool: search_logs, service: orders}
