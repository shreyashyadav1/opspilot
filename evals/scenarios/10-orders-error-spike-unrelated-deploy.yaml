id: orders-error-spike-unrelated-deploy
title: Orders pricing bug, with an unrelated payments deploy nearby
description: >
  35% of order creations fail with a NullPointerException in the pricing code. A payments
  deploy with no config changes went out shortly before; the deploy is a red herring.
alert:
  title: Checkout error rate above SLO
  service: storefront
  details: POST /checkout 5xx rate is above the 2% SLO.
fault:
  type: error_spike
  target: orders
  params: {error_rate: 0.35}
distractors:
  - {type: benign_deploy, service: payments, minutes_ago: 6}
expected:
  root_cause_service: orders
  category: error_rate
  action: {type: escalate, target_service: orders}
relevant_services: [orders, storefront]
required_evidence:
  - {tool: search_logs, service: orders}
