id: storefront-error-spike
title: Storefront pricing bug on a share of checkouts
description: >
  30% of checkouts hit a KeyError in storefront's promo pricing path. Orders and payments are
  healthy; they simply see fewer requests.
alert:
  title: Checkout error rate above SLO
  service: storefront
  details: POST /checkout is returning 500 Internal Server Error for some requests.
fault:
  type: error_spike
  target: storefront
  params: {error_rate: 0.3}
expected:
  root_cause_service: storefront
  category: error_rate
  action: {type: escalate, target_service: storefront}
relevant_services: [storefront]
required_evidence:
  - {tool: search_logs, service: storefront}
