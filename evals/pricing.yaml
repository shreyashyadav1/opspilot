# USD per million tokens, used to price token usage reported by the provider.
# Check the provider's current price list before publishing results; models not listed here
# are reported with an unknown cost.
#
# groq:openai/gpt-oss-120b: $0.15 / $0.60 per million input/output tokens, from Groq's own model
# page (https://console.groq.com/docs/model/openai/gpt-oss-120b), checked 2026-10-10. Replaces
# groq:llama-3.3-70b-versatile, which Groq shut down for free and developer tiers on 2026-08-16
# (https://console.groq.com/docs/deprecations).
groq:openai/gpt-oss-120b:
  input: 0.15
  output: 0.60
# switchyard:gpt-oss-120b: priced as its first target in Switchyard's example config (Groq's
# openai/gpt-oss-120b, same source and date as above). A call served by a fallback target can cost
# differently; Switchyard's own cost_usd log field and metric are the source of truth for those.
switchyard:gpt-oss-120b:
  input: 0.15
  output: 0.60
fake:playbook:
  input: 0.0
  output: 0.0
