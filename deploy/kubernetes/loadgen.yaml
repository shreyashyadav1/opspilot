# loadgen: steady background traffic against the storefront (4 requests per second), so faults
# show up in the metrics and logs. It serves nothing, so it has no Service or probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    app.kubernetes.io/name: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: opspilot-python-services
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "opsdemo.loadgen.main"]
          env:
            - name: TARGET_URL
              value: http://storefront:8080
            - name: RPS
              value: "4"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 160Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
